<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <!-- Sky / World Lighting Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Ground / Temple Mountain Gradients -->
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4d4d8" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b" />
      <stop offset="50%" stop-color="#3f3f46" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Glowing AR Scan Shader -->
    <linearGradient id="arScanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>

    <filter id="hudShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Device / Screen Viewport (Bezel) -->
  <rect width="1200" height="740" fill="#090d16" />
  
  <!-- 3D Game World Render Viewport -->
  <g id="game_world">
    <!-- Sky & Distant Mountains -->
    <rect x="0" y="0" width="1200" height="480" fill="url(#skyGrad)" />
    <!-- Sun -->
    <circle cx="980" cy="120" r="90" fill="url(#sunGlow)" />
    <circle cx="980" cy="120" r="35" fill="#ffffff" />

    <!-- Distant Mountains (Atmospheric Perspective) -->
    <polygon points="-50,420 180,240 380,420" fill="#93c5fd" opacity="0.6" />
    <polygon points="260,420 540,190 820,420" fill="#60a5fa" opacity="0.5" />
    <polygon points="680,420 950,230 1220,420" fill="#93c5fd" opacity="0.6" />

    <!-- Midground Trees & Tropical Foliage -->
    <rect x="0" y="380" width="1200" height="120" fill="#166534" opacity="0.4" />
    <polygon points="40,410 70,330 100,410" fill="#15803d" />
    <polygon points="80,410 110,310 140,410" fill="#166534" />
    <polygon points="120,420 160,320 200,420" fill="#14532d" />
    <polygon points="1020,420 1060,310 1100,420" fill="#166534" />
    <polygon points="1080,410 1120,330 1160,410" fill="#15803d" />

    <!-- 3D Ground Terrain & Path -->
    <polygon points="0,420 1200,420 1200,740 0,740" fill="url(#grassGrad)" />
    <!-- Cobblestone Temple Pathway in 3D perspective -->
    <polygon points="560,420 640,420 820,740 380,740" fill="url(#pathGrad)" />
    <!-- Stone tile lines on path -->
    <line x1="540" y1="460" x2="660" y2="460" stroke="#52525b" stroke-width="2" />
    <line x1="510" y1="510" x2="690" y2="510" stroke="#52525b" stroke-width="2" />
    <line x1="470" y1="570" x2="730" y2="570" stroke="#52525b" stroke-width="3" />
    <line x1="420" y1="645" x2="780" y2="645" stroke="#52525b" stroke-width="3" />

    <!-- 3D Ancient Temple Structure (Candi Nusantara / AR Objective) -->
    <g transform="translate(680, 220)">
      <!-- Temple Base Tiers -->
      <polygon points="30,220 290,220 310,250 10,250" fill="url(#stoneGrad)" />
      <polygon points="50,170 270,170 290,220 30,220" fill="#3f3f46" stroke="#27272a" stroke-width="1.5"/>
      <polygon points="75,120 245,120 270,170 50,170" fill="url(#stoneGrad)" />
      <polygon points="100,70 220,70 245,120 75,120" fill="#3f3f46" />
      <polygon points="135,20 185,20 200,70 120,70" fill="url(#stoneGrad)" />
      <!-- Stupa Finial -->
      <polygon points="155,0 165,0 168,20 152,20" fill="#71717a" />
      <circle cx="160" cy="5" r="4" fill="#fbbf24" />

      <!-- Relief Carvings & Niches -->
      <rect x="135" y="130" width="50" height="40" rx="4" fill="#18181b" />
      <path d="M 135,130 Q 160,110 185,130 Z" fill="#18181b" />

      <!-- Interactive Glowing AR Target Mesh / Hologram (Sila 3 - Pohon Beringin) -->
      <polygon points="140,80 180,80 170,115 150,115" fill="#38bdf8" opacity="0.4" filter="url(#glow)"/>
      <circle cx="160" cy="148" r="14" fill="#38bdf8" opacity="0.75" filter="url(#glow)" />
      <text x="154" y="153" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">🌳</text>

      <!-- AR Laser Scan Overlay & Bounding Wireframe -->
      <polygon points="100,80 220,80 240,190 80,190" fill="url(#arScanBeam)" />
      <!-- Hologram Target Corner Markers -->
      <path d="M 85,85 L 105,85 M 85,85 L 85,105" stroke="#38bdf8" stroke-width="3" fill="none" />
      <path d="M 235,85 L 215,85 M 235,85 L 235,105" stroke="#38bdf8" stroke-width="3" fill="none" />
      <path d="M 85,185 L 105,185 M 85,185 L 85,165" stroke="#38bdf8" stroke-width="3" fill="none" />
      <path d="M 235,185 L 215,185 M 235,185 L 235,165" stroke="#38bdf8" stroke-width="3" fill="none" />

      <!-- Floating Prompt -->
      <rect x="70" y="35" width="180" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
      <text x="85" y="56" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">✦ TARGET AR DITEMUKAN</text>
    </g>

    <!-- 3D Player Character (Low-poly stylized hero viewed from behind) -->
    <g transform="translate(480, 520)">
      <!-- Shadow on ground -->
      <ellipse cx="60" cy="155" rx="45" ry="14" fill="#052e16" opacity="0.5" />
      <!-- Legs & Boots -->
      <rect x="42" y="105" width="16" height="42" rx="5" fill="#1e293b" />
      <rect x="62" y="105" width="16" height="42" rx="5" fill="#1e293b" />
      <rect x="38" y="140" width="22" height="15" rx="4" fill="#78350f" />
      <rect x="60" y="140" width="22" height="15" rx="4" fill="#78350f" />
      <!-- Torso / Jacket -->
      <path d="M 35,55 L 85,55 L 80,108 L 40,108 Z" fill="#dc2626" />
      <!-- Explorer Backpack -->
      <rect x="42" y="58" width="36" height="38" rx="8" fill="#b45309" stroke="#78350f" stroke-width="2"/>
      <rect x="48" y="66" width="24" height="14" rx="4" fill="#d97706" />
      <!-- Head & Hair -->
      <circle cx="60" cy="38" r="18" fill="#fed7aa" />
      <path d="M 42,35 Q 60,18 78,35 Q 60,25 42,35 Z" fill="#18181b" />
      <!-- Traditional Headband (Ikat Kepala Merah Putih) -->
      <rect x="44" y="32" width="32" height="6" rx="2" fill="#ef4444" />
      <line x1="44" y1="35" x2="76" y2="35" stroke="#ffffff" stroke-width="2" />
    </g>
  </g>

  <!-- ==================== GAME HUD (HEADS-UP DISPLAY) ==================== -->

  <!-- Top-Left Player Status Bar -->
  <g transform="translate(30, 25)" filter="url(#hudShadow)">
    <!-- Base plate -->
    <rect width="360" height="64" rx="32" fill="#0f172a" stroke="#334155" stroke-width="2" opacity="0.92"/>
    <!-- Avatar circle -->
    <circle cx="32" cy="32" r="26" fill="#1e3a8a" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="21" y="39" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="900">G</text>
    <rect x="20" y="47" width="24" height="13" rx="4" fill="#fbbf24" />
    <text x="23" y="57" fill="#000000" font-family="sans-serif" font-size="9" font-weight="bold">LV.8</text>

    <!-- Player Name & Stats -->
    <text x="70" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Gerry • Petualang Nusantara</text>
    <!-- HP / Health Bar -->
    <rect x="70" y="35" width="130" height="10" rx="5" fill="#334155" />
    <rect x="70" y="35" width="112" height="10" rx="5" fill="#ef4444" />
    <text x="208" y="44" fill="#cbd5e1" font-family="monospace" font-size="10">86%</text>

    <!-- Energy / Mana Bar -->
    <rect x="70" y="48" width="130" height="7" rx="3.5" fill="#334155" />
    <rect x="70" y="48" width="95" height="7" rx="3.5" fill="#06b6d4" />

    <!-- Coin / Star Pill -->
    <rect x="250" y="16" width="95" height="32" rx="16" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="266" cy="32" r="9" fill="#f59e0b" />
    <text x="263" y="36" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">★</text>
    <text x="282" y="37" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">4,850</text>
  </g>

  <!-- Top-Center Quest Indicator -->
  <g transform="translate(420, 25)" filter="url(#hudShadow)">
    <rect width="360" height="50" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" opacity="0.94"/>
    <rect x="10" y="10" width="30" height="30" rx="6" fill="#4f46e5" />
    <text x="18" y="31" fill="#ffffff" font-family="sans-serif" font-size="16">📜</text>
    <text x="50" y="26" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">MISI EDUKASI PANCASILA</text>
    <text x="50" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Pindai Relief Sila ke-3: Persatuan Indonesia</text>
  </g>

  <!-- Top-Right Minimap Radar & Settings -->
  <g transform="translate(1040, 25)" filter="url(#hudShadow)">
    <circle cx="65" cy="65" r="55" fill="#0f172a" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
    <!-- Radar concentric rings -->
    <circle cx="65" cy="65" r="38" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="65" cy="65" r="20" fill="none" stroke="#1e293b" stroke-width="1"/>
    <line x1="65" y1="12" x2="65" y2="118" stroke="#334155" stroke-dasharray="2,2"/>
    <line x1="12" y1="65" x2="118" y2="65" stroke="#334155" stroke-dasharray="2,2"/>
    <!-- Player center indicator -->
    <polygon points="65,58 70,72 65,68 60,72" fill="#38bdf8" />
    <!-- Objective blip with pulse -->
    <circle cx="85" cy="45" r="5" fill="#facc15" filter="url(#glow)"/>
    <!-- Compass N -->
    <text x="61" y="24" fill="#ef4444" font-family="sans-serif" font-size="10" font-weight="900">U</text>
  </g>

  <!-- Bottom-Left Virtual Touch D-PAD (Mobile / Tablet Controls) -->
  <g transform="translate(60, 560)" filter="url(#hudShadow)">
    <circle cx="70" cy="70" r="65" fill="#0f172a" stroke="#475569" stroke-width="2" opacity="0.75"/>
    <circle cx="70" cy="70" r="30" fill="#334155" stroke="#64748b" stroke-width="2" opacity="0.9"/>
    <!-- Arrows -->
    <polygon points="70,18 78,30 62,30" fill="#94a3b8" />
    <polygon points="70,122 78,110 62,110" fill="#94a3b8" />
    <polygon points="18,70 30,62 30,78" fill="#94a3b8" />
    <polygon points="122,70 110,62 110,78" fill="#94a3b8" />
  </g>

  <!-- Dialogue Box with NPC / Educator at Bottom Center -->
  <g transform="translate(240, 600)" filter="url(#hudShadow)">
    <rect width="660" height="100" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    
    <!-- NPC Avatar Frame -->
    <rect x="15" y="15" width="70" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="50" cy="45" r="22" fill="#f59e0b" />
    <text x="40" y="52" fill="#ffffff" font-family="sans-serif" font-size="20">🧙‍♂️</text>
    <rect x="18" y="70" width="64" height="14" rx="4" fill="#0284c7" />
    <text x="21" y="80" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="bold">KI GURU</text>

    <!-- Dialogue Text -->
    <text x="100" y="38" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800">TUTOR BUDAYA NUSANTARA</text>
    <text x="100" y="58" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">"Arahkan kameramu ke relief candi di depan untuk mengaktifkan hologram 3D Pohon Beringin!</text>
    <text x="100" y="76" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Kumpulkan artefak budaya untuk membuka kuis interaktif kebangsaan."</text>

    <!-- Tap to continue blinking indicator -->
    <text x="615" y="85" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">▶ [TAP]</text>
  </g>

  <!-- Bottom-Right Action Buttons (Interact / AR Scan / Jump) -->
  <g transform="translate(930, 540)" filter="url(#hudShadow)">
    <!-- Button A: AR Scan (Primary Feature) -->
    <circle cx="160" cy="90" r="42" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" opacity="0.95"/>
    <circle cx="160" cy="90" r="34" fill="#0369a1" />
    <text x="146" y="96" fill="#ffffff" font-family="sans-serif" font-size="20">📷</text>
    <text x="140" y="124" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">PINDAI AR</text>

    <!-- Button B: Jump -->
    <circle cx="85" cy="140" r="28" fill="#1e293b" stroke="#64748b" stroke-width="1.5" opacity="0.9"/>
    <text x="78" y="146" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">⤴</text>
    <text x="73" y="162" fill="#94a3b8" font-family="sans-serif" font-size="8">LOMPAT</text>

    <!-- Button X: Inventory -->
    <circle cx="95" cy="50" r="28" fill="#1e293b" stroke="#64748b" stroke-width="1.5" opacity="0.9"/>
    <text x="88" y="56" fill="#ffffff" font-family="sans-serif" font-size="13">🎒</text>
    <text x="84" y="72" fill="#94a3b8" font-family="sans-serif" font-size="8">TAS</text>
  </g>

  <!-- Unity / Engine Watermark watermark at top bar -->
  <rect x="0" y="724" width="1200" height="16" fill="#020617" />
  <text x="15" y="736" fill="#64748b" font-family="monospace" font-size="10">BUILD: Unity 3D v2022.3 LTS • AR Foundation • Vuforia Engine • TARGET: Android/iOS (60 FPS)</text>
</svg>
