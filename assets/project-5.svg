  <text x="114" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Valentino Motor Bogor | Bengkel Resmi</text>

  <!-- URL Bar -->
  <rect x="350" y="8" width="580" height="24" rx="6" fill="#0b1320" stroke="#334155" stroke-width="1" />
