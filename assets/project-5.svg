      <path d="M 95,31 L 165,25 M 95,79 L 165,85" stroke="#f59e0b" stroke-width="5" />
      <circle cx="95" cy="55" r="8" fill="#18181b" />
      <circle cx="165" cy="55" r="10" fill="#18181b" />

