  </defs>

  <!-- Browser Window Frame -->
  <rect width="1200" height="740" rx="14" fill="#0f172a" />

  <!-- Window Header / Title Bar -->
  <path d="M 0,14 Q 0,0 14,0 L 1186,0 Q 1200,0 1200,14 L 1200,40 L 0,40 Z" fill="#1e293b" />
  <circle cx="22" cy="20" r="5.5" fill="#ef4444" />
  <circle cx="40" cy="20" r="5.5" fill="#f59e0b" />
  <circle cx="58" cy="20" r="5.5" fill="#10b981" />

  <!-- Tab -->
  <path d="M 85,8 L 315,8 Q 320,8 324,14 L 334,40 L 76,40 L 83,14 Q 85,8 85,8 Z" fill="#0f172a" />
