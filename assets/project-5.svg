      <rect x="120" y="20" width="20" height="10" rx="2" fill="#ef4444" />
      <text x="116" y="55" fill="#000000" font-family="sans-serif" font-size="8" font-weight="900">MOTUL</text>
      <text x="118" y="68" fill="#000000" font-family="sans-serif" font-size="7">10W-40</text>

      <text x="14" y="135" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Ganti Oli Mesin &amp; Gardan</text>
