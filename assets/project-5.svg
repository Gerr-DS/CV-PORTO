      <text x="14" y="152" fill="#64748b" font-family="sans-serif" font-size="11">Pembersihan mangkok ganda, roller, sliding sheave, pelumasan grease high-temp.</text>
      <text x="14" y="180" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="800">Rp 50.000</text>
      
      <rect x="14" y="195" width="227" height="28" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="75" y="213" fill="#dc2626" font-family="sans-serif" font-size="11" font-weight="700">Pilih Layanan</text>
