      <text x="14" y="135" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Servis Injeksi &amp; Reset ECU</text>
      <text x="14" y="152" fill="#64748b" font-family="sans-serif" font-size="11">Scanning data sensor, kalibrasi TPS, dan reset riwayat error kode DTC.</text>
      <text x="14" y="180" fill="#dc2626" font-family="sans-serif" font-size="13" font-weight="800">Rp 45.000</text>
      
      <rect x="14" y="195" width="227" height="28" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
      <text x="75" y="213" fill="#dc2626" font-family="sans-serif" font-size="11" font-weight="700">Pilih Layanan</text>
