  <text x="385" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">https://valentinomotorbogor.asia<tspan fill="#f87171">/booking-servis</tspan></text>

  <!-- Window Right -->
  <circle cx="1140" cy="20" r="10" fill="#dc2626" />
  <text x="1136" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">V</text>

  <!-- ==================== WEB PAGE VIEWPORT ==================== -->
  <rect x="0" y="40" width="1200" height="700" fill="#f8fafc" />

  <!-- Top Info Bar -->
  <rect x="0" y="40" width="1200" height="30" fill="#18181b" />
  <text x="50" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11">📍 Jl. Brigjen Saptadji Hadiprawira No. 77, Cilendek Barat, Bogor Barat</text>
  <text x="640" y="60" fill="#facc15" font-family="sans-serif" font-size="11">⏰ Buka Setiap Hari: 08.00 - 17.00 WIB</text>
  <text x="960" y="60" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">📞 Hotline: 0812-9842-xxxx</text>

