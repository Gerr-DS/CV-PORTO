<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <filter id="shadow-mis" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#020617" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="hero-mis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="mis-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Browser Window Chrome Background -->
  <rect width="1200" height="740" rx="14" fill="#0b1320" />

  <!-- Window Header / Title Bar -->
  <path d="M 0,14 Q 0,0 14,0 L 1186,0 Q 1200,0 1200,14 L 1200,40 L 0,40 Z" fill="#1e293b" />
  <circle cx="22" cy="20" r="5.5" fill="#ef4444" />
  <circle cx="40" cy="20" r="5.5" fill="#f59e0b" />
  <circle cx="58" cy="20" r="5.5" fill="#10b981" />

  <!-- Tab -->
  <path d="M 85,8 L 320,8 Q 325,8 329,14 L 339,40 L 76,40 L 83,14 Q 85,8 85,8 Z" fill="#0f172a" />
  <circle cx="98" cy="24" r="5" fill="#0284c7" />
  <text x="114" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Marino Inti Solusi | Hardware Keamanan</text>

  <!-- Address Bar -->
