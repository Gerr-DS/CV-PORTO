      <text x="14" y="160" fill="#64748b" font-family="sans-serif" font-size="11">ColorVu malam hari, deteksi wajah &amp; plat nomor, NVR server cloud storage.</text>
      <text x="14" y="190" fill="#0284c7" font-family="sans-serif" font-size="13" font-weight="800">Dahua &amp; Hikvision</text>
      
      <rect x="14" y="206" width="227" height="28" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="80" y="224" fill="#0284c7" font-family="sans-serif" font-size="11" font-weight="700">Detail Spesifikasi</text>
    </g>

    <!-- Card 3: Barrier Gate Otomatis -->
