      <line x1="110" y1="48" x2="125" y2="48" stroke="#dc2626" stroke-width="7" />
      <line x1="145" y1="48" x2="160" y2="48" stroke="#dc2626" stroke-width="7" />
      <line x1="180" y1="48" x2="195" y2="48" stroke="#dc2626" stroke-width="7" />

      <text x="14" y="142" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Barrier Gate Otomatis</text>
      <text x="14" y="160" fill="#64748b" font-family="sans-serif" font-size="11">Palang parkir perumahan cluster &amp; kantor. Sensor loop detector &amp; kartu RFID.</text>
      <text x="14" y="190" fill="#0284c7" font-family="sans-serif" font-size="13" font-weight="800">Motor Brushless High-Speed</text>
      
      <rect x="14" y="206" width="227" height="28" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="80" y="224" fill="#0284c7" font-family="sans-serif" font-size="11" font-weight="700">Detail Spesifikasi</text>
    </g>

    <!-- Card 4: Smart Digital Lock & Intercom -->
    <g transform="translate(825, 55)">
      <rect width="255" height="245" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-mis)"/>
      <rect width="255" height="115" rx="10" fill="#18181b" />
      <!-- Digital Door Lock Graphic -->
      <rect x="110" y="20" width="35" height="75" rx="6" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
      <circle cx="127" cy="38" r="8" fill="#38bdf8" opacity="0.8"/>
      <!-- Keypad dots -->
      <circle cx="120" cy="58" r="2" fill="#ffffff" />
      <circle cx="127" cy="58" r="2" fill="#ffffff" />
      <circle cx="134" cy="58" r="2" fill="#ffffff" />
      <rect x="118" y="72" width="30" height="7" rx="3" fill="#a1a1aa" />

      <text x="14" y="142" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">Smart Door Lock &amp; Intercom</text>
      <text x="14" y="160" fill="#64748b" font-family="sans-serif" font-size="11">Kunci pintu digital PIN/kartu/sidik jari, video door phone, &amp; sistem smart hotel.</text>
      <text x="14" y="190" fill="#0284c7" font-family="sans-serif" font-size="13" font-weight="800">Solusi Hunian &amp; Kantor</text>
      
      <rect x="14" y="206" width="227" height="28" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
      <text x="80" y="224" fill="#0284c7" font-family="sans-serif" font-size="11" font-weight="700">Detail Spesifikasi</text>
