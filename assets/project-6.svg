      <circle cx="127" cy="55" r="18" fill="#09090b" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="127" cy="55" r="8" fill="#38bdf8" />
      <circle cx="132" cy="50" r="3" fill="#ffffff" />
