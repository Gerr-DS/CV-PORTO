    <line x1="22" y1="24" x2="22" y2="28" stroke="#38bdf8" stroke-width="2" />

    <text x="56" y="25" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="900" letter-spacing="0.5">MARINO <tspan fill="#0284c7">INTI SOLUSI</tspan></text>
    <text x="56" y="40" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">SECURITY &amp; HARDWARE SYSTEMS</text>
  </g>

  <!-- Nav links -->
  <g transform="translate(520, 68)">
