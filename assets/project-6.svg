    <line x1="0" y1="6" x2="52" y2="6" stroke="#0284c7" stroke-width="2" />
    
    <text x="80" y="0" fill="#334155" font-family="sans-serif" font-size="13" font-weight="500">Access Control</text>
    <text x="210" y="0" fill="#334155" font-family="sans-serif" font-size="13" font-weight="500">CCTV Surveillance</text>
    <text x="355" y="0" fill="#334155" font-family="sans-serif" font-size="13" font-weight="500">Barrier Gate</text>
    <text x="465" y="0" fill="#334155" font-family="sans-serif" font-size="13" font-weight="500">Portofolio</text>
