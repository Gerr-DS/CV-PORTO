  <text x="1136" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">M</text>

  <!-- ==================== WEB PAGE VIEWPORT ==================== -->
  <rect x="0" y="40" width="1200" height="700" fill="#f8fafc" />

  <!-- Main Navbar -->
  <rect x="0" y="40" width="1200" height="68" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Logo -->
  <g transform="translate(50, 52)">
    <rect width="44" height="44" rx="8" fill="#0f172a" />
    <!-- Shield / Keyhole Hardware Emblem -->
    <path d="M 22,9 L 34,14 L 34,26 C 34,33 22,38 22,38 C 22,38 10,33 10,26 L 10,14 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" />
