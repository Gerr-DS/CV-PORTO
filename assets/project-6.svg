      <text x="0" y="92" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Access Control &amp; CCTV Modern</text>

      <!-- Subtitle -->
      <text x="0" y="124" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Pemasangan sistem keamanan gedung, perumahan, pabrik, &amp; area komersial.</text>
      <text x="0" y="142" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Didukung teknologi biometrik, barrier gate otomatis, IP Camera 4K AI, dan garansi resmi.</text>

      <!-- Buttons -->
      <g transform="translate(0, 165)">
