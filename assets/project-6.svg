  <text x="370" y="24" fill="#10b981" font-family="monospace" font-size="11">🔒</text>
  <text x="390" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">https://marinointisolusi.com<tspan fill="#38bdf8">/solusi-keamanan</tspan></text>

  <!-- Window Right -->
