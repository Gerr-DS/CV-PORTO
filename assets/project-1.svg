    <text x="24" y="30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800">DITEMUKAN</text>

    <!-- Card Content -->
    <text x="16" y="176" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">KTM IPB a.n Gerry</text>
    <text x="16" y="196" fill="#64748b" font-family="sans-serif" font-size="11">📍 Koridor FEMA, Dramaga</text>
    <text x="16" y="214" fill="#64748b" font-family="sans-serif" font-size="11">🕒 24 Nov 2024 • 14:20 WIB</text>

    <text x="16" y="240" fill="#475569" font-family="sans-serif" font-size="11">Ditemukan dompet kartu berisi KTM Departemen Ilmu Komputer &amp; Flazz BCA.</text>

    <line x1="16" y1="326" x2="249" y2="326" stroke="#f1f5f9" stroke-width="1" />
    <rect x="16" y="338" width="233" height="30" rx="6" fill="#2563eb" />
    <text x="96" y="358" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Klaim Barang</text>
  </g>

  <!-- Card 2: Kunci Motor Honda -->
  <g transform="translate(325, 324)">
    <rect width="265" height="380" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0,10 Q 0,0 10,0 L 255,0 Q 265,0 265,10 L 265,150 L 0,150 Z" fill="#334155" />
    <!-- Key graphic -->
    <circle cx="120" cy="70" r="22" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="120" cy="70" r="10" fill="#1e293b" />
    <rect x="135" y="65" width="45" height="10" rx="2" fill="#94a3b8" />
    <rect x="160" y="75" width="8" height="8" rx="1" fill="#94a3b8" />
    <rect x="172" y="75" width="8" height="6" rx="1" fill="#94a3b8" />
    <rect x="75" y="78" width="35" height="16" rx="3" fill="#dc2626" />
    <text x="80" y="90" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold">HONDA</text>
    <!-- Badge -->
    <rect x="15" y="15" width="92" height="22" rx="4" fill="#059669" />
    <text x="24" y="30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800">DITEMUKAN</text>

    <text x="16" y="176" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Kunci Motor Vario + Remote</text>
    <text x="16" y="196" fill="#64748b" font-family="sans-serif" font-size="11">📍 Parkiran Perpustakaan Pusat</text>
    <text x="16" y="214" fill="#64748b" font-family="sans-serif" font-size="11">🕒 25 Nov 2024 • 09:15 WIB</text>
    <text x="16" y="240" fill="#475569" font-family="sans-serif" font-size="11">Gantungan tali warna merah hitam. Diserahkan ke pos satpam gerbang perpustakaan.</text>

    <line x1="16" y1="326" x2="249" y2="326" stroke="#f1f5f9" stroke-width="1" />
    <rect x="16" y="338" width="233" height="30" rx="6" fill="#2563eb" />
    <text x="96" y="358" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Klaim Barang</text>
  </g>

  <!-- Card 3: Laptop Asus ROG (Hilang / DICARI) -->
  <g transform="translate(610, 324)">
    <rect width="265" height="380" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0,10 Q 0,0 10,0 L 255,0 Q 265,0 265,10 L 265,150 L 0,150 Z" fill="#18181b" />
    <!-- Laptop graphic -->
    <rect x="65" y="40" width="135" height="80" rx="5" fill="#27272a" stroke="#ef4444" stroke-width="1"/>
    <text x="110" y="85" fill="#ef4444" font-family="sans-serif" font-size="16" font-weight="900">ROG</text>
    <polygon points="50,122 215,122 225,128 40,128" fill="#3f3f46" />
    <!-- Badge DICARI -->
    <rect x="15" y="15" width="75" height="22" rx="4" fill="#dc2626" />
    <text x="25" y="30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800">DICARI</text>

    <text x="16" y="176" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Tas Laptop ASUS Hitam</text>
    <text x="16" y="196" fill="#64748b" font-family="sans-serif" font-size="11">📍 Ruang Lab Komputer FMIPA</text>
    <text x="16" y="214" fill="#64748b" font-family="sans-serif" font-size="11">🕒 23 Nov 2024 • 17:30 WIB</text>
    <text x="16" y="240" fill="#475569" font-family="sans-serif" font-size="11">Tertinggal di meja baris 3 lab komputer. Ada stiker Github dan Docker di bodi cover.</text>

    <line x1="16" y1="326" x2="249" y2="326" stroke="#f1f5f9" stroke-width="1" />
    <rect x="16" y="338" width="233" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="82" y="358" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="700">Kontak Pelapor</text>
  </g>

  <!-- Card 4: Tumbler Corkcicle -->
  <g transform="translate(895, 324)">
    <rect width="265" height="380" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />
    <path d="M 0,10 Q 0,0 10,0 L 255,0 Q 265,0 265,10 L 265,150 L 0,150 Z" fill="#042f2e" />
    <!-- Tumbler illustration -->
    <rect x="115" y="35" width="35" height="90" rx="8" fill="#0d9488" stroke="#5eead4" stroke-width="1.5"/>
    <rect x="122" y="26" width="21" height="10" rx="2" fill="#ccfbf1" />
    <line x1="115" y1="58" x2="150" y2="58" stroke="#134e4a" stroke-width="2" />
    <!-- Badge -->
    <rect x="15" y="15" width="92" height="22" rx="4" fill="#059669" />
    <text x="24" y="30" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800">DITEMUKAN</text>

    <text x="16" y="176" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Tumbler Corkcicle Sage</text>
    <text x="16" y="196" fill="#64748b" font-family="sans-serif" font-size="11">📍 Gazebo Rektorat IPB</text>
    <text x="16" y="214" fill="#64748b" font-family="sans-serif" font-size="11">🕒 25 Nov 2024 • 11:00 WIB</text>
    <text x="16" y="240" fill="#475569" font-family="sans-serif" font-size="11">Warna sage green 16oz dengan goresan kecil di bagian bawah penutup tumbler.</text>

    <line x1="16" y1="326" x2="249" y2="326" stroke="#f1f5f9" stroke-width="1" />
    <rect x="16" y="338" width="233" height="30" rx="6" fill="#2563eb" />
    <text x="96" y="358" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Klaim Barang</text>
  </g>
</svg>
