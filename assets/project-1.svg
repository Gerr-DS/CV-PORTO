<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#051329" flood-opacity="0.35"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f2647" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d3b66" />
      <stop offset="100%" stop-color="#001e3d" />
    </linearGradient>
    <linearGradient id="primary-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="alert-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fffbeb" />
    </linearGradient>
  </defs>

  <!-- Browser Window Chrome Background -->
  <rect width="1200" height="740" rx="16" fill="#0b1727" />

  <!-- Window Header / Title Bar -->
  <path d="M 0,16 Q 0,0 16,0 L 1184,0 Q 1200,0 1200,16 L 1200,42 L 0,42 Z" fill="#1e293b" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />

  <!-- Browser URL Tab & Address Bar -->
  <path d="M 96,8 L 290,8 Q 296,8 300,14 L 312,42 L 84,42 L 92,14 Q 94,8 96,8 Z" fill="#0f172a" />
  <circle cx="106" cy="24" r="5" fill="#3b82f6" />
  <text x="120" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">IPB Kehilangan | Portal Kampus</text>

  <!-- Address bar -->
  <rect x="330" y="9" width="560" height="25" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="345" y="26" fill="#10b981" font-family="monospace" font-size="11">🔒</text>
  <text x="365" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">https://kehilangan.apps.ipb.ac.id<tspan fill="#38bdf8">/beranda</tspan></text>

  <!-- Window controls right -->
  <circle cx="1120" cy="21" r="8" fill="#334155" />
  <circle cx="1150" cy="21" r="11" fill="#2563eb" />
  <text x="1146" y="25" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">G</text>

  <!-- Web Content Viewport Area -->
  <rect x="0" y="42" width="1200" height="698" fill="#f8fafc" />

  <!-- Web App Navbar (IPB Blue Theme) -->
  <rect x="0" y="42" width="1200" height="64" fill="url(#header-grad)" />
  <!-- IPB Logo emblem placeholder -->
  <circle cx="60" cy="74" r="18" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
  <path d="M 50,78 L 60,63 L 70,78 Z" fill="#facc15" />
  <circle cx="60" cy="74" r="5" fill="#1e3a8a" />
  <text x="90" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800" letter-spacing="0.5">IPB KEHILANGAN</text>
  <text x="90" y="87" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Layanan Informasi Temuan &amp; Kehilangan Barang Kampus</text>

  <!-- Navbar Nav items -->
  <rect x="440" y="58" width="80" height="32" rx="6" fill="#1e40af" />
  <text x="458" y="79" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Beranda</text>
  <text x="548" y="79" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">Daftar Barang</text>
  <text x="668" y="79" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">Klaim Temuan</text>
  <text x="788" y="79" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">Statistik</text>

  <!-- CTA Lapor Kehilangan -->
  <rect x="990" y="56" width="170" height="36" rx="8" fill="#ef4444" />
  <text x="1010" y="79" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">+ Lapor Kehilangan</text>

  <!-- Hero / Search Section Banner -->
  <rect x="40" y="126" width="1120" height="136" rx="12" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1.5" />
  <text x="70" y="162" fill="#0369a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Cari Barang Hilang atau Laporkan Barang Temuan Anda</text>
  <text x="70" y="184" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Terhubung dengan sivitas akademika IPB Dramaga, Baranangsiang, dan Kampus Sukabumi.</text>

  <!-- Search Input Bar with Filter -->
  <g transform="translate(70, 198)">
    <rect width="640" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="20" y="28" fill="#64748b" font-family="sans-serif" font-size="13">🔍  Cari nama barang (KTM, Kunci Motor, Tumbler, Flashdisk...)</text>
    
    <!-- Lokasi Dropdown -->
    <rect x="720" y="0" width="220" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="740" y="28" fill="#334155" font-family="sans-serif" font-size="13">📍 Seluruh Kampus IPB</text>
    <text x="915" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">▼</text>

    <!-- Search Button -->
    <rect x="955" y="0" width="135" height="46" rx="8" fill="url(#primary-btn)" />
    <text x="1000" y="28" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="700">Cari</text>
  </g>

  <!-- Filter Category Badges -->
  <g transform="translate(40, 276)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e3a8a" />
    <text x="24" y="21" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Semua (184)</text>

    <rect x="140" y="0" width="150" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="160" y="21" fill="#475569" font-family="sans-serif" font-size="12" font-weight="600">Ditemukan (112)</text>

    <rect x="300" y="0" width="140" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="320" y="21" fill="#475569" font-family="sans-serif" font-size="12" font-weight="600">Kehilangan (72)</text>

    <rect x="450" y="0" width="130" height="32" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="470" y="21" fill="#475569" font-family="sans-serif" font-size="12" font-weight="600">Terselesaikan</text>

    <text x="1000" y="21" fill="#64748b" font-family="sans-serif" font-size="12">Menampilkan <tspan fill="#0f172a" font-weight="700">1 - 4</tspan> dari 184 laporan</text>
  </g>

  <!-- Items Feed Grid (4 Realistic Cards) -->

  <!-- Card 1: KTM IPB -->
  <g transform="translate(40, 324)">
    <rect width="265" height="380" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Image placeholder area with realistic graphic -->
    <rect x="0" y="0" width="265" height="150" rx="10" fill="#1e293b" />
    <path d="M 0,10 Q 0,0 10,0 L 255,0 Q 265,0 265,10 L 265,150 L 0,150 Z" fill="#0f172a" />
    <!-- ID Card Realistic illustration inside -->
    <rect x="42" y="25" width="180" height="105" rx="6" fill="#1e40af" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="52" y="38" width="35" height="42" rx="3" fill="#cbd5e1" />
    <rect x="95" y="42" width="110" height="6" rx="2" fill="#ffffff" />
    <rect x="95" y="54" width="85" height="5" rx="2" fill="#93c5fd" />
    <rect x="95" y="65" width="70" height="5" rx="2" fill="#93c5fd" />
    <rect x="52" y="90" width="153" height="4" rx="2" fill="#facc15" />
    <!-- Badge Status -->
